---
openapi: 3.0.3
info:
  title: "SIS Public API"
  description: "Public API for the Stored Identity Service"
  version: "1.0.0"
paths:
  /.well-known/jwks.json:
    get:
      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              type: string
          content:
            application/jwks+json:
              schema:
                type: object
        "404":
          description: Not Found
      x-amazon-apigateway-integration:
        credentials:
          Fn::GetAtt: RestOAuthDocumentResourceS3Role.Arn
        uri:
          Fn::Sub:
            - "arn:aws:apigateway:${AWS::Region}:s3:path/${BucketName}/jwks.json"
            - BucketName:
                Fn::ImportValue:
                  Fn::Sub: "${SharedStackName}-PublishedKeysS3Bucket"
        passthroughBehavior: WHEN_NO_MATCH
        httpMethod: GET
        type: aws
        responses:
          "200":
            statusCode: "200"
            responseParameters:
              method.response.header.Cache-Control: "'max-age=3600, private'"
          "404":
            statusCode: "404"
            responseTemplates:
              application/json: |
                {
                    "message": "Not Found"
                }
  /confirm-details:
    get:
      responses:
        "200":
          description: OK
          content:
            text/html:
              schema:
                type: string
      x-amazon-apigateway-integration:
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AppHandler.Arn}:live/invocations
        type: aws_proxy
    post:
      responses:
        "302":
          description: OK
          content:
            text/html:
              schema:
                type: string
      x-amazon-apigateway-integration:
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PostConfirmDetailsHandler.Arn}:live/invocations
        type: aws_proxy
  /error/session-expired:
    get:
      responses:
        "401":
          description: Session Expired
          content:
            text/html:
              schema:
                type: string
      x-amazon-apigateway-integration:
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetSessionExpiredHandler.Arn}:live/invocations
        type: aws_proxy
  /error/unrecoverable:
    get:
      responses:
        "500":
          description: Internal Server Error
          content:
            text/html:
              schema:
                type: string
      x-amazon-apigateway-integration:
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetUnrecoverableErrorHandler.Arn}:live/invocations
        type: aws_proxy
  /error/bad-request:
    get:
      responses:
        "400":
          description: Internal Server Error
          content:
            text/html:
              schema:
                type: string
      x-amazon-apigateway-integration:
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetUnrecoverableErrorHandler.Arn}:live/invocations
        type: aws_proxy
  /{item+}:
    get:
      parameters:
        - name: item
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 200 response
          headers:
            Cache-Control:
              type: string
            Content-Length:
              type: string
            Timestamp:
              type: string
            Content-Type:
              type: string
      x-amazon-apigateway-integration:
        credentials:
          Fn::GetAtt: AssetsResourceS3Role.Arn
        httpMethod: GET
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:s3:path/${GovUKAssetsBucket}/{item}
        responses:
          default:
            statusCode: "200"
            responseParameters:
              method.response.header.Cache-Control: "'public, max-age=10'"
              method.response.header.Content-Type: integration.response.header.Content-Type
              method.response.header.Content-Length: integration.response.header.Content-Length
              method.response.header.Timestamp: integration.response.header.Date
        requestParameters:
          integration.request.path.item: method.request.path.item
        type: aws
  /oauth2/authorize:
    get:
      summary: Get an authorization grant
      description: |
        The authorization endpoint is used to interact with the resource owner
        and obtain an authorization grant.
      tags:
        - Authorization
      parameters:
        - $ref: "#/components/parameters/ClientIdParam"
        - $ref: "#/components/parameters/RequestParam"
      responses:
        "302":
          description: OK
          content:
            text/html:
              schema:
                type: string
      x-amazon-apigateway-integration:
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetAuthorizeHandler.Arn}:live/invocations
        passthroughBehavior: NEVER
        contentHandling: CONVERT_TO_TEXT
        type: AWS_PROXY
  /oauth2/callback:
    get:
      responses:
        "302":
          $ref: "#/components/responses/AuthorizationRedirect"
      x-amazon-apigateway-integration:
        httpMethod: POST
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetCallbackHandler.Arn}:live/invocations
        type: aws_proxy

components:
  parameters:
    ClientIdParam:
      in: query
      name: client_id
      required: true
      description: |
        This value is the client id the Relying Party service was provided with for identification upon
        registration. Internal system requests will use an internal client id.
      schema:
        type: string
    AuthCodeParam:
      in: query
      name: code
      required: true
      description: |
        The auth code.
      schema:
        type: string
    RequestParam:
      in: query
      name: request
      required: false
      description: This value would be a JAR, passed in as a query parameter
      schema:
        type: string
  responses:
    AuthorizationRedirect:
      description: |
        Successful authorization. The server redirects the user-agent back to the
        client's `redirect_uri` with the authorization `code` and the `state`.
      headers:
        Location:
          description: The redirect URL containing the code and state as query parameters.
          schema:
            type: string
            format: uri
            example: https://orch.stubs.account.gov.uk/callback?code=SplxlOBeZQQYbYS6WxSbIA&state=xyz
