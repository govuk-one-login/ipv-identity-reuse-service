name: test

on:
  workflow_call:
    secrets:
      sonar-token:
        required: true

permissions:
  id-token: write
  contents: read
  packages: read

jobs:
  test-code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
          registry-url: "https://npm.pkg.github.com/"
          scope: "@govuk-one-login"

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: TypeScript compiler check
        run: npm run type-check

      - name: Unit tests
        run: npm run test

      - name: Linting
        run: npm run lint

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        if: ${{ github.actor != 'dependabot[bot]' && env.ACT != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.token }} # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.sonar-token }}
